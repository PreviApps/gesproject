services:
  backend:
    build: 
      context: ./backend
    container_name: gesproject-backend
    restart: always
    ports:
      - "3014:3014"
    env_file: 
      - ./backend/.env

  frontend:
    build: 
      context: ./frontend
    container_name: gesproject-frontend
    restart: always
    ports:
      - "4014:80"
    depends_on:
      - backend
    env_file:
      - ./frontend/.env