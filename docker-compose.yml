version: '3.8'

services:
  backend:
    build: ./backend
    container_name: gesproject-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Agrega aquí tus variables de entorno si usas bases de datos (ej. DB_HOST=postgres, etc.)
    networks:
      - gesproject-net

  frontend:
    build: ./frontend
    container_name: gesproject-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - gesproject-net

networks:
  gesproject-net:
    driver: bridge